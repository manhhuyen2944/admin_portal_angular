<app-auth-layout
  [title]="'auth.forgotPasswordTitle' | translate"
  [subtitle]="'auth.forgotPasswordDesc' | translate"
  icon="mail"
  backHref="/auth/login"
>
  @if (errorMessage()) {
    <div class="mb-5">
      <app-alert
        variant="danger"
        [title]="errorMessage()!"
        [dismissible]="true"
        (dismiss)="errorMessage.set(null)"
      />
    </div>
  }

  <form (submit)="handleSubmit($event)" class="flex flex-col gap-5" novalidate>
    <app-form-field [label]="'auth.emailAddress' | translate" [required]="true">
      <app-input
        type="email"
        [placeholder]="'auth.emailPlaceholder' | translate"
        [(ngModel)]="email"
        name="email"
        [required]="true"
      />
    </app-form-field>

    <app-button
      type="submit"
      variant="primary"
      size="md"
      [fullWidth]="true"
      [loading]="isLoading()"
      [disabled]="!email()"
    >
      {{ 'auth.sendResetCode' | translate }}
    </app-button>
  </form>

  <ng-container auth-footer>
    <p class="text-xs text-muted">
      {{ 'auth.backToSignIn' | translate }}?
      <a routerLink="/auth/login" class="font-semibold text-primary hover:underline">{{ 'auth.signIn' | translate }}</a>
    </p>
  </ng-container>
</app-auth-layout>
