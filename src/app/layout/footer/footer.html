<footer class="border-t border-border bg-surface/98 backdrop-blur-md px-4 sm:px-6 lg:px-8 shadow-xs">
  <div class="flex flex-col sm:flex-row items-center justify-between gap-3 py-4 max-w-screen-2xl mx-auto">
    <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2 text-xs text-muted order-2 sm:order-1">
      <span>&copy; {{ year }} {{ companyName() }}. {{ 'footer.allRightsReserved' | translate }}</span>
      <span class="hidden sm:inline text-border">&bull;</span>
      <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-surface-raised border border-border text-[11px] font-mono">
        <span class="h-1.5 w-1.5 rounded-full bg-success animate-pulse"></span>
        {{ version() }} &bull; {{ displayStatus() }}
      </span>
    </div>
    <ng-content select="[footer-links]" />

    @if (showLinks()) {
      <nav class="flex flex-wrap items-center justify-center gap-4 text-xs order-1 sm:order-2" aria-label="Footer navigation">
        @for (link of (links() ?? defaultLinks()); track link.label) {
          <a [href]="link.href" class="text-muted hover:text-primary transition-colors cursor-pointer">{{ link.label }}</a>
        }
      </nav>
    }
  </div>
</footer>
