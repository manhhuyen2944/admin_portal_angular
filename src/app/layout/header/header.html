<header
  class="flex h-16 w-full shrink-0 items-center justify-between
         gap-2 sm:gap-4 border-b border-border bg-surface shadow-xs px-3 sm:px-6 lg:px-8 max-w-full"
  role="banner"
>
  <!-- Left side: Hamburger (mobile), Logo / Title / Breadcrumb Slot -->
  <div class="flex items-center gap-2 sm:gap-3 min-w-0 flex-1 sm:flex-initial lg:pl-1">
    <!-- Hamburger: mobile only (toggles sidebar drawer) -->
    <button
      type="button"
      class="lg:hidden flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-border bg-surface hover:bg-surface-raised text-foreground transition-colors cursor-pointer"
      aria-label="Toggle navigation sidebar"
      (click)="toggleSidebarMenu()"
    >
      <app-icon name="menu" size="sm" />
    </button>

    <!-- Custom left slot (Breadcrumb or Page context) -->
    <ng-content select="[header-left]" />

    <!-- Default Brand Logo & Title if no custom left slot provided -->
    @if (showBrand()) {
      <div class="flex items-center gap-2 min-w-0">
        <div class="flex h-8 w-8 items-center justify-center rounded-xl bg-primary text-white shadow-md shadow-primary/20 shrink-0">
          <app-icon name="layout-dashboard" size="xs" />
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <h1 class="text-xs sm:text-sm font-bold leading-tight text-foreground truncate">
              {{ title() }}
            </h1>
            @if (badge()) {
              <span class="inline-flex items-center gap-1 rounded-full bg-success/10 text-success-dark px-1.5 sm:px-2 py-0.5 text-[10px] font-semibold shrink-0">
                <span class="h-1.5 w-1.5 rounded-full bg-success animate-pulse"></span>
                <span>{{ badge() }}</span>
              </span>
            }
          </div>
          @if (subtitle()) {
            <p class="text-[10px] text-muted truncate">{{ subtitle() }}</p>
          }
        </div>
      </div>
    }
  </div>

  <!-- Right Actions & Controls -->
  <div class="flex items-center gap-1 sm:gap-2 shrink-0">
    <!-- Search Trigger Button -->
    @if (showSearch()) {
      <!-- Desktop: lg+ -->
      <button
        type="button"
        class="hidden lg:inline-flex items-center gap-2 rounded-lg border border-border bg-surface-raised px-3 py-1.5 text-xs text-muted hover:text-foreground hover:border-primary/40 transition-all cursor-pointer"
        (click)="openCommandPalette.emit()"
      >
        <app-icon name="search" size="xs" />
        <span>{{ searchLabel() }}</span>
        <kbd class="rounded bg-surface border border-border px-1.5 py-0.5 text-[10px] font-mono">⌘K</kbd>
      </button>

      <!-- Mobile / Tablet: < lg -->
      <button
        type="button"
        class="lg:hidden flex h-8 w-8 sm:h-9 sm:w-9 items-center justify-center rounded-xl border border-border bg-surface hover:bg-surface-raised text-muted hover:text-foreground transition-colors cursor-pointer"
        [attr.aria-label]="searchLabel()"
        (click)="openCommandPalette.emit()"
      >
        <app-icon name="search" size="xs" />
      </button>
    }

    <!-- Custom page actions slot -->
    <ng-content select="[header-actions]" />

    <!-- Notification Bell -->
    @if (showNotifications()) {
      <app-notification-bell />
    }

    <!-- Theme Selector -->
    @if (showThemeSelector()) {
      <app-theme-selector />
    }

    <!-- Language Selector -->
    @if (showLanguageSelector()) {
      <app-language-selector />
    }

    <!-- User Menu -->
    <div class="h-6 w-px bg-border mx-1 hidden sm:block"></div>
    <app-user-menu [user]="effectiveUser()" (signOut)="signOut.emit()" />
  </div>
</header>
